<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>PILOT HUD</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<!-- Sensor izni ekrani: iOS DeviceOrientation kullanici hareketi olmadan izin vermiyor -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-title">PILOT HUD</div>
    <div class="gate-sub">NEURAL LINK STANDBY</div>
    <p class="gate-text">
      Sistem konum ve pusula sensorlerine erisim istiyor.
      Baglanmak icin dokun.
    </p>
    <button id="gate-connect" class="btn btn-primary">BAGLAN</button>
    <button id="gate-sim" class="btn">SIMULASYON MODU</button>
    <div id="gate-err" class="gate-err"></div>
  </div>
</div>

<main id="hud" hidden>
  <video id="cam" class="cam" playsinline muted autoplay></video>

  <!-- Ust: pusula seridi -->
  <div class="strip-wrap">
    <canvas id="strip" class="strip"></canvas>
    <div class="strip-mark"></div>
  </div>

  <!-- Orta: nisangah -->
  <div class="reticle">
    <span class="r-line r-l"></span>
    <span class="r-line r-r"></span>
    <span class="r-dot"></span>
  </div>

  <!-- Sol ust: durum -->
  <div class="panel p-tl">
    <div class="p-head">SYS</div>
    <div class="row"><span class="k">GPS</span><span class="v" id="v-fix">---</span></div>
    <div class="row"><span class="k">HDG</span><span class="v" id="v-hdg">---</span></div>
    <div class="row"><span class="k">SRC</span><span class="v" id="v-src">---</span></div>
  </div>

  <!-- Sag ust: minimap -->
  <div class="map-wrap">
    <canvas id="map" class="map"></canvas>
    <div class="map-scale" id="v-scale">--- m</div>
  </div>

  <!-- Sol alt: konum -->
  <div class="panel p-bl">
    <div class="p-head">POS</div>
    <div class="row"><span class="k">LAT</span><span class="v" id="v-lat">--.-----</span></div>
    <div class="row"><span class="k">LON</span><span class="v" id="v-lon">--.-----</span></div>
    <div class="row"><span class="k">ACC</span><span class="v" id="v-acc">--- m</span></div>
  </div>

  <!-- Sag alt: hareket -->
  <div class="panel p-br">
    <div class="p-head">VEL</div>
    <div class="big" id="v-spd">0.0</div>
    <div class="unit">km/h</div>
    <div class="row"><span class="k">ALT</span><span class="v" id="v-alt">--- m</span></div>
    <div class="row"><span class="k">DST</span><span class="v" id="v-trip">0 m</span></div>
  </div>

  <!-- Alt orta: hedef -->
  <div class="wp" id="wp-box">
    <div class="wp-head">TARGET</div>
    <div class="wp-body">
      <span class="wp-dist" id="v-wpd">---</span>
      <span class="wp-brg" id="v-wpb">---</span>
    </div>
  </div>

  <!-- Kontroller -->
  <div class="ctrl">
    <button class="btn btn-sm" id="b-cam">KAMERA</button>
    <button class="btn btn-sm" id="b-mark">HEDEF KOY</button>
    <button class="btn btn-sm" id="b-clear">TEMIZLE</button>
    <button class="btn btn-sm" id="b-zoom">MENZIL</button>
  </div>

  <div class="scan"></div>
</main>

<script>
  (function() {
    var errBox = document.getElementById('gate-err');
    function logErr(msg) {
      if (errBox) errBox.textContent = msg;
    }
    window.addEventListener('error', function(e) {
      var loc = e.filename ? e.filename.split('/').pop() + ':' + e.lineno : '';
      logErr(e.message + ' ' + loc);
    });
    window.addEventListener('unhandledrejection', function(e) {
      logErr(e.reason ? (e.reason.message || e.reason) : 'Promise hatasi');
    });
    setTimeout(function() {
      if (!window.__hudReady) {
        logErr('Uygulama kodu yuklenemedi');
      }
    }, 3000);
  })();
</script>
<script type="module" src="src/app.js?v=3"></script>
</body>
</html>
