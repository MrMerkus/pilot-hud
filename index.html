<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>PILOT HUD</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<!-- Sensor izni ekrani: iOS DeviceOrientation kullanici hareketi olmadan izin vermiyor -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-title">PILOT HUD</div>
    <div class="gate-sub">NEURAL LINK STANDBY</div>
    <p class="gate-text">
      Sistem konum ve pusula sensorlerine erisim istiyor.
      Baglanmak icin dokun.
    </p>
    <button id="gate-connect" class="btn btn-primary">BAGLAN</button>
    <button id="gate-sim" class="btn">SIMULASYON MODU</button>
    <div id="gate-err" class="gate-err"></div>
  </div>
</div>

<main id="hud" hidden>
  <video id="cam" class="cam" playsinline muted autoplay></video>

  <!-- Ust: pusula seridi -->
  <div class="strip-wrap">
    <canvas id="strip" class="strip"></canvas>
    <div class="strip-mark"></div>
  </div>

  <!-- Sol ust: GPS uyari -->
  <div id="gps-warn" class="gps-warn" hidden>GPS ARANIYOR</div>

  <!-- Orta: nisangah -->
  <div class="reticle">
    <span class="r-line r-l"></span>
    <span class="r-line r-r"></span>
    <span class="r-dot"></span>
  </div>

  <div id="wp-mark" class="wp-mark" hidden><div class="wp-diamond"></div><div class="wp-label" id="wp-label">--- m</div></div>
  <div id="wp-edge" class="wp-edge" hidden><div class="wp-arrow"></div><div class="wp-edge-label" id="wp-edge-label">---</div></div>

  <!-- Sag ust: minimap -->
  <div class="map-wrap">
    <div id="basemap" class="basemap"></div>
    <canvas id="map" class="map"></canvas>
    <div class="map-scale" id="v-scale">--- m</div>
    <div id="map-status" class="map-status"></div>
  </div>

  <!-- Sag alt: hiz gostergesi -->
  <div class="spd"><span class="big" id="v-spd">0.0</span><span class="unit">km/h</span></div>

  <!-- Alt orta: hedef -->
  <div class="wp" id="wp-box">
    <div class="wp-head">TARGET</div>
    <div class="wp-body">
      <span class="wp-dist" id="v-wpd">---</span>
      <span class="wp-brg" id="v-wpb">---</span>
    </div>
  </div>

  <!-- Kontroller -->
  <div class="ctrl">
    <button class="btn btn-sm" id="b-cam">KAMERA</button>
    <button class="btn btn-sm" id="b-mark">HEDEF KOY</button>
    <button class="btn btn-sm" id="b-clear">TEMIZLE</button>
    <button class="btn btn-sm" id="b-zoom">MENZIL</button>
  </div>

  <div class="attrib">&copy; OpenStreetMap contributors &middot; Protomaps</div>
</main>

<script>
  (function() {
    var errBox = document.getElementById('gate-err');
    function logErr(msg) {
      if (errBox) errBox.textContent = msg;
    }
    window.addEventListener('error', function(e) {
      var loc = e.filename ? e.filename.split('/').pop() + ':' + e.lineno : '';
      logErr(e.message + ' ' + loc);
    });
    window.addEventListener('unhandledrejection', function(e) {
      logErr(e.reason ? (e.reason.message || e.reason) : 'Promise hatasi');
    });
    setTimeout(function() {
      if (!window.__hudReady) {
        logErr('Uygulama kodu yuklenemedi');
      }
    }, 3000);
  })();
</script>
<script src="vendor/pmtiles.js"></script>
<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="src/app.js?v=7"></script>
</body>
</html>
